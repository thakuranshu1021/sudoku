```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sudoku Game</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      font-family: Arial, sans-serif;

      background: linear-gradient(
        135deg,
        #141e30,
        #243b55
      );
    }

    .game {
      width: 100%;
      max-width: 500px;

      padding: 25px;

      background: #1e1e1e;

      border-radius: 20px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.4);
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      text-align: center;
      margin-bottom: 20px;
    }

    #board {
      width: 100%;
      max-width: 450px;

      margin: auto;

      display: grid;
      grid-template-columns: repeat(9, 1fr);

      border: 3px solid white;
    }

    .cell {
      width: 100%;
      aspect-ratio: 1;

      border: 1px solid #777;

      background: #2c2c2c;
      color: white;

      text-align: center;

      font-size: clamp(18px, 5vw, 30px);

      outline: none;
    }

    .cell:focus {
      background: #3d5a80;
    }

    .fixed {
      background: #444;

      color: white;

      font-weight: bold;
    }

    /* Vertical 3x3 borders */

    .cell:nth-child(3n) {
      border-right: 3px solid white;
    }

    .cell:nth-child(9n) {
      border-right: none;
    }

    /* Horizontal 3x3 borders */

    .cell:nth-child(n+19):nth-child(-n+27),
    .cell:nth-child(n+46):nth-child(-n+54) {
      border-bottom: 3px solid white;
    }

    .wrong {
      background: #8b2020 !important;
    }

    .controls {
      display: flex;

      justify-content: center;

      gap: 10px;

      flex-wrap: wrap;

      margin-top: 20px;
    }

    button {
      border: none;

      border-radius: 10px;

      padding: 12px 18px;

      color: white;

      background: #333;

      font-size: 16px;

      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);

      background: #444;
    }

    .check {
      background: #0984e3;
    }

    .new-game {
      background: #00b894;
    }

    .solve {
      background: #6c5ce7;
    }

    .message {
      min-height: 25px;

      margin-top: 18px;

      color: white;

      text-align: center;

      font-weight: bold;
    }

    .info {
      margin-top: 15px;

      color: #aaa;

      text-align: center;

      font-size: 14px;
    }

    @media (max-width: 400px) {

      .game {
        padding: 15px;
      }

      button {
        padding: 10px 13px;
      }
    }
  </style>
</head>

<body>

  <div class="game">

    <h1>🧩 Sudoku</h1>

    <p class="subtitle">
      Fill every row, column and 3×3 box with numbers 1–9.
    </p>

    <div id="board"></div>

    <div class="controls">

      <button class="check" id="checkBtn">
        Check
      </button>

      <button class="new-game" id="newGameBtn">
        New Game
      </button>

      <button class="solve" id="solveBtn">
        Solve
      </button>

    </div>

    <div class="message" id="message">
      Good luck! 🎯
    </div>

    <div class="info">
      Enter numbers from 1 to 9.
    </div>

  </div>


  <script>

    /* ================================
       PUZZLE
    ================================= */

    const puzzle = [

      [5, 3, 0, 0, 7, 0, 0, 0, 0],

      [6, 0, 0, 1, 9, 5, 0, 0, 0],

      [0, 9, 8, 0, 0, 0, 0, 6, 0],

      [8, 0, 0, 0, 6, 0, 0, 0, 3],

      [4, 0, 0, 8, 0, 3, 0, 0, 1],

      [7, 0, 0, 0, 2, 0, 0, 0, 6],

      [0, 6, 0, 0, 0, 0, 2, 8, 0],

      [0, 0, 0, 4, 1, 9, 0, 0, 5],

      [0, 0, 0, 0, 8, 0, 0, 7, 9]

    ];


    const solution = [

      [5, 3, 4, 6, 7, 8, 9, 1, 2],

      [6, 7, 2, 1, 9, 5, 3, 4, 8],

      [1, 9, 8, 3, 4, 2, 5, 6, 7],

      [8, 5, 9, 7, 6, 1, 4, 2, 3],

      [4, 2, 6, 8, 5, 3, 7, 9, 1],

      [7, 1, 3, 9, 2, 4, 8, 5, 6],

      [9, 6, 1, 5, 3, 7, 2, 8, 4],

      [2, 8, 7, 4, 1, 9, 6, 3, 5],

      [3, 4, 5, 2, 8, 6, 1, 7, 9]

    ];


    const board =
      document.getElementById("board");

    const message =
      document.getElementById("message");


    /* ================================
       CREATE BOARD
    ================================= */

    function createBoard() {

      board.innerHTML = "";

      for (let row = 0; row < 9; row++) {

        for (let col = 0; col < 9; col++) {

          const cell =
            document.createElement("input");

          cell.className = "cell";

          cell.type = "text";

          cell.maxLength = 1;

          cell.inputMode = "numeric";

          cell.dataset.row = row;

          cell.dataset.col = col;


          const value =
            puzzle[row][col];


          if (value !== 0) {

            cell.value = value;

            cell.disabled = true;

            cell.classList.add("fixed");

          }


          cell.addEventListener(
            "input",
            function () {

              this.value =
                this.value.replace(
                  /[^1-9]/g,
                  ""
                );

              this.classList.remove(
                "wrong"
              );

            }
          );


          board.appendChild(cell);

        }

      }

    }


    /* ================================
       CHECK ANSWERS
    ================================= */

    function checkSudoku() {

      const cells =
        document.querySelectorAll(".cell");

      let complete = true;

      let correct = true;


      cells.forEach(cell => {

        cell.classList.remove("wrong");


        const row =
          Number(cell.dataset.row);

        const col =
          Number(cell.dataset.col);


        if (cell.value === "") {

          complete = false;

          return;

        }


        const answer =
          Number(cell.value);


        if (
          answer !==
          solution[row][col]
        ) {

          correct = false;

          cell.classList.add("wrong");

        }

      });


      if (!complete) {

        message.textContent =
          "⚠️ Complete the puzzle first.";

      }

      else if (!correct) {

        message.textContent =
          "❌ Some answers are incorrect.";

      }

      else {

        message.textContent =
          "🎉 Congratulations! You solved Sudoku!";

      }

    }


    /* ================================
       SOLVE
    ================================= */

    function solveSudoku() {

      const cells =
        document.querySelectorAll(".cell");


      cells.forEach(cell => {

        const row =
          Number(cell.dataset.row);

        const col =
          Number(cell.dataset.col);


        cell.value =
          solution[row][col];

        cell.classList.remove(
          "wrong"
        );

      });


      message.textContent =
        "✅ Sudoku solved!";

    }


    /* ================================
       NEW GAME
    ================================= */

    function newGame() {

      createBoard();

      message.textContent =
        "Good luck! 🎯";

    }


    /* ================================
       BUTTONS
    ================================= */

    document
      .getElementById("checkBtn")
      .addEventListener(
        "click",
        checkSudoku
      );


    document
      .getElementById("newGameBtn")
      .addEventListener(
        "click",
        newGame
      );


    document
      .getElementById("solveBtn")
      .addEventListener(
        "click",
        solveSudoku
      );


    /* ================================
       START
    ================================= */

    createBoard();

  </script>

</body>
</html>
